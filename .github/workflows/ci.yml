name: CI

# Build and test on every push and pull request.
#
# A hosted runner can compile this repository but cannot fully test it, and the
# workflow says so rather than pretending either way.
#
# The language data the analysers read — resources/lexical/*.db, the frequency
# tables, and the ONNX graphs under models/ — is gitignored on purpose: it is
# multi-gigabyte build output, rebuilt from ai/scripts/. Without it 79 tests fail
# on ranking and lookup, not because the product is broken but because the corpus
# they assert against is absent. Deleting, skipping or relaxing those tests to get
# a green tick would throw away the only check on the language engine's behaviour.
#
# So: the build, the product metadata and the string-resource invariants are
# verified here on every push, and the full suite runs wherever the corpus exists —
# locally, and as the first gate inside build/build-release.ps1, which refuses to
# produce an installer from a tree whose tests do not pass.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # WPF, WinForms and UI Automation: the solution only builds on Windows.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WriteLite.sln

      - name: Build (Release)
        run: dotnet build WriteLite.sln -c Release --no-restore

      - name: Check the stamped product identity
        shell: pwsh
        run: |
          # Directory.Build.props is the only place the version is declared.
          # A release whose binaries carry SDK defaults is the state this repo was
          # in before 1.0, so it is worth failing the build over.
          $exe = Get-ChildItem -Recurse -Filter WriteLite.exe `
            -Path src/WriteLite.App/bin/Release | Select-Object -First 1
          if (-not $exe) { throw 'WriteLite.exe was not produced' }
          $info = $exe.VersionInfo
          Write-Host "ProductName    : $($info.ProductName)"
          Write-Host "ProductVersion : $($info.ProductVersion)"
          Write-Host "FileVersion    : $($info.FileVersion)"
          Write-Host "Company        : $($info.CompanyName)"
          if ($info.ProductName -ne 'WriteLite') { throw 'ProductName is not WriteLite' }
          if (-not $info.CompanyName)            { throw 'CompanyName is empty' }
          if ($info.ProductVersion -match '\+')  { throw "ProductVersion carries a metadata suffix: $($info.ProductVersion)" }

      - name: Is the language corpus present?
        id: corpus
        shell: pwsh
        run: |
          # The markers the analyser tests need. All are gitignored, so on a hosted
          # runner this is expected to be false.
          $needed = @(
            'resources/lexical/writelight-lexical.db',
            'models/writelite-punctuation/model.onnx',
            'models/writelight-qwen/writelight-qwen-q4_k_m.gguf'
          )
          $missing = $needed | Where-Object { -not (Test-Path $_) }
          $present = $missing.Count -eq 0
          "present=$($present.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $present) {
            Write-Host "absent: $($missing -join ', ')"
          }

      - name: Test (full suite)
        if: steps.corpus.outputs.present == 'true'
        run: >
          dotnet test tests/WriteLite.Tests/WriteLite.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=WriteLite.Tests.trx"
          --results-directory TestResults

      - name: Test (corpus-independent subset)
        if: steps.corpus.outputs.present != 'true'
        shell: pwsh
        run: |
          # What can honestly be checked without the corpus: the release-critical
          # invariants that regressed in 1.0 and have nothing to do with language
          # data — the string resources behind the correction card and the
          # Diagnostics page, the installer/app autostart contract, and the
          # bundled-runtime path the packaging step has to fill.
          Write-Host '::warning::Language corpus is not in this checkout; the analyser tests cannot run here. Full suite: build/build-release.ps1 on a machine that has it.'
          dotnet test tests/WriteLite.Tests/WriteLite.Tests.csproj `
            -c Release --no-build `
            --filter 'FullyQualifiedName~StringResourceIntegrity|FullyQualifiedName~AutostartReconciler|FullyQualifiedName~BundledJavaRuntimeContract' `
            --logger 'trx;LogFileName=WriteLite.Subset.trx' `
            --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
